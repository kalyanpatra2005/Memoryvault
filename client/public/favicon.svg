<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vaultGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281a0e" />
      <stop offset="100%" stop-color="#150c05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Antique Gold Safe Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#vaultGold)" stroke="#fef3c7" stroke-width="2" stroke-opacity="0.6" filter="url(#shadow)" />
  
  <!-- Outer Rim Border -->
  <rect x="7.5" y="7.5" width="49" height="49" rx="11" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Inner Dark Vault Door -->
  <rect x="13" y="13" width="38" height="38" rx="8" fill="url(#innerPlate)" stroke="#f59e0b" stroke-width="2" />
  
  <!-- Corner Steel Bolts -->
  <circle cx="17.5" cy="17.5" r="1.8" fill="#fde68a" />
  <circle cx="46.5" cy="17.5" r="1.8" fill="#fde68a" />
  <circle cx="17.5" cy="46.5" r="1.8" fill="#fde68a" />
  <circle cx="46.5" cy="46.5" r="1.8" fill="#fde68a" />

  <!-- 4-Spoke Safe Steering Lock -->
  <line x1="22" y1="22" x2="42" y2="42" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round" />
  <line x1="22" y1="42" x2="42" y2="22" stroke="#fcd34d" stroke-width="3.5" stroke-linecap="round" />

  <!-- Handle Knobs -->
  <circle cx="21" cy="21" r="2.8" fill="#fef08a" stroke="#b45309" stroke-width="1" />
  <circle cx="43" cy="43" r="2.8" fill="#fef08a" stroke="#b45309" stroke-width="1" />
  <circle cx="21" cy="43" r="2.8" fill="#fef08a" stroke="#b45309" stroke-width="1" />
  <circle cx="43" cy="21" r="2.8" fill="#fef08a" stroke="#b45309" stroke-width="1" />

  <!-- Center Wheel Hub -->
  <circle cx="32" cy="32" r="7.5" fill="url(#vaultGold)" stroke="#fef08a" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3.2" fill="#1c1005" stroke="#fde68a" stroke-width="1" />
  <circle cx="32" cy="32" r="1.2" fill="#fde68a" />
</svg>
